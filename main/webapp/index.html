
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Based Sales Forecasting</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #243b64, #176b87);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 380px;
            max-width: calc(100% - 60px);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px #0004;
        }

        h1 {
            color: #203864;
            text-align: center;
            font-size: 26px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #2457c5;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #183f99;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>AI-Based Sales Forecasting</h1>

        <p>Enter historical sales amounts to predict
           the next period's sales.</p>

        <form action="forecast" method="post">
            <label for="sales">Historical Sales (₹)</label>

            <input type="text"
                   id="sales"
                   name="sales"
                   placeholder="25000,28000,31000,35000"
                   required>

            <button type="submit">
                Predict Future Sales
            </button>
        </form>
    </div>
</body>
</html>
